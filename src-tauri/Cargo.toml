[package]
name = "virtuai-desktop"
version = "0.1.0"
description = "VirtuAI Desktop: web chat plus the local connector"
edition = "2021"
license = "Apache-2.0"
# Tauri 2.12 and its plugins need 1.90; an older toolchain fails at resolution
# with "uuid requires rustc 1.89" or similar, which does not say what to do.
rust-version = "1.90"
publish = false

[lib]
name = "virtuai_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# The title bar fix (src/titlebar.rs): the versions Tauri already pulls in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSGeometry"] }

